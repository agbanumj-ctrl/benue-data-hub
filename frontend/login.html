<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Benue Data Hub</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <div class="container nav-container">

            <a href="index.html" class="logo">
                <img src="assets/logos/logo.png" alt="Benue Data Hub Logo">
            </a>

            <nav class="nav">
                <a href="index.html">Home</a>
                <a href="services.html">Services</a>
                <a href="register.html">Register</a>
            </nav>

        </div>
    </header>


    <main>

        <section class="auth-section">

            <div class="auth-card">

                <div class="auth-heading">
                    <p class="eyebrow">BENUE DATA HUB</p>

                    <h1>Welcome Back</h1>

                    <p>
                        Login to access your Benue Data Hub account.
                    </p>
                </div>


                <form id="loginForm">

                    <div class="form-group">
                        <label for="email">Email Address</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>


                    <button type="submit" class="primary-btn auth-btn">
                        Login
                    </button>

                </form>


                <p class="auth-footer">
                    Don't have an account?
                    <a href="register.html">Create an account</a>
                </p>

            </div>

        </section>

    </main>


    <footer class="footer">

        <div class="footer-bottom">
            <p>
                © 2026 Benue Data Hub. All rights reserved.
            </p>
        </div>

    </footer>


   <script src="js/script.js"></script>

</body>
</html>
