<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Benue Data Hub</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="container nav-container">

            <a href="index.html" class="logo">
                <img src="assets/logos/logo.png" alt="Benue Data Hub Logo">
            </a>

            <nav class="nav">
                <a href="index.html">Home</a>
                <a href="services.html">Services</a>
                <a href="login.html">Login</a>
            </nav>

        </div>
    </header>


    <!-- REGISTER -->
    <main>

        <section class="register-section">

            <div class="register-card">

                <div class="register-heading">

                    <p class="eyebrow">BENUE DATA HUB</p>

                    <h1>Create Account</h1>

                    <p>
                        Create your account to access Benue Data Hub services.
                    </p>

                </div>


                <form id="registerForm">

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="primary-btn register-btn"
                    >
                        Create Account
                    </button>

                </form>


                <p class="register-footer">

                    Already have an account?

                    <a href="login.html">
                        Login here
                    </a>

                </p>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="footer">

        <div class="footer-bottom">

            <p>
                © 2026 Benue Data Hub. All rights reserved.
            </p>

        </div>

    </footer>


    <script src="js/script.js"></script>

</body>
</html>
